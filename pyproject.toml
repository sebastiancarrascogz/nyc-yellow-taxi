[tool.poetry]
name = "nyc-yellow-taxi"
version = "0.0.2"
description = "NYC Yellow Taxi with Medallion Architecture and Metabase dashboard"
authors = ["Sebastian Carrasco <sebx23@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
dlt = "^1.27.2"
dbt-core = "^1.11.11"
prefect = "^3.7.4"
python-dotenv = "^1.2.2"
