[tool.poetry]
packages = [{include = "nyc_yellow_taxi"}]
name = "nyc-yellow-taxi"
version = "1.0.0"
description = "NYC Yellow Taxi with Medallion Architecture and Looker dashboard"
authors = ["Sebastian Carrasco <sebx23@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
dlt = {extras = ["bigquery"], version = "^1.29.0"}
dbt-core = "^1.11.11"
prefect = "^3.7.4"
python-dotenv = "^1.2.2"
pyyaml = "^6.0.3"
pandas = "^3.0.3"
pyarrow = "^25.0.0"
duckdb = "^1.5.4"
dbt-bigquery = "^1.12.0"
geopandas = "^1.1.4"
python-dateutil = "^2.9.0.post0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]

[tool.poetry.scripts]
ingest-yellow-trips = "nyc_yellow_taxi.ingestion.load_yellow_trips:main"
ingest-taxi-zones = "nyc_yellow_taxi.ingestion.load_taxi_zones_shp:ingest_taxi_zones"
